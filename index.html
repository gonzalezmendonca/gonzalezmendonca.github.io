<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>González Mendonça — Próximamente</title>
  <meta name="description" content="González Mendonça — decoración a tu estilo y tu presupuesto. Nuestro sitio está en camino." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;1,9..144,400&family=Work+Sans:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ivory: #faf6ee;
      --line-strong: rgba(42, 36, 27, 0.28);
      --taupe: #8a7c68;
      --ink: #2a2419;
      --accent: #b5673f;
      --serif: "Fraunces", "Iowan Old Style", "Georgia", serif;
      --sans: "Work Sans", "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .soon {
      display: grid;
      justify-items: center;
      gap: 1.25rem;
      animation: rise 1.2s var(--ease) both;
    }

    .soon__mark {
      font-family: var(--serif);
      font-size: 0.95rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--taupe);
    }

    .soon__title {
      margin: 0;
      font-family: var(--serif);
      font-weight: 340;
      font-style: italic;
      font-size: clamp(3rem, 12vw, 7.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .soon__rule {
      width: 3rem;
      height: 1px;
      background: var(--accent);
    }

    .soon__text {
      margin: 0;
      max-width: 28rem;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--taupe);
    }

    .preview-link {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--taupe);
      text-decoration: none;
      transition: color 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .preview-link:hover,
    .preview-link:focus-visible {
      color: var(--ink);
      border-color: var(--ink);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .soon { animation: none; }
    }
  </style>
</head>
<body>

  <main class="soon">
    <span class="soon__mark">González Mendonça</span>
    <h1 class="soon__title">Próximamente</h1>
    <span class="soon__rule" aria-hidden="true"></span>
    <p class="soon__text">Estamos preparando un nuevo espacio. Muy pronto vas a poder conocer el proyecto.</p>
  </main>

  <a class="preview-link" href="sitio.html">Ver avance</a>

</body>
</html>
