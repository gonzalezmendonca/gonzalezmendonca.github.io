<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logos &amp; Marcas — González Mendonça</title>
  <meta name="description" content="Marcas y aliados que acompañan los proyectos de González Mendonça, interiorismo y decoración." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,440;0,9..144,500;1,9..144,400;1,9..144,440&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <a class="skip-link" href="#logos">Ir al contenido</a>

  <header class="topbar">
    <a class="topbar__mark" href="index.html">GM</a>
    <a class="topbar__social" href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
  </header>

  <main>
    <section class="logos" id="logos" aria-labelledby="logos-title">
      <p class="logos__eyebrow reveal">Confían en nosotros</p>
      <h1 class="logos__title reveal" id="logos-title">Marcas &amp; Aliados</h1>

      <div class="logos__grid">
        <figure class="logos__item reveal-image">
          <div class="logos__frame">
            <span class="logos__num">01</span>
            <img class="logos__img" src="img/logos/logo-1.png" alt="Logo 1" loading="lazy" onerror="this.style.display='none'" />
          </div>
        </figure>

        <figure class="logos__item reveal-image">
          <div class="logos__frame">
            <span class="logos__num">02</span>
            <img class="logos__img" src="img/logos/logo-2.png" alt="Logo 2" loading="lazy" onerror="this.style.display='none'" />
          </div>
        </figure>

        <figure class="logos__item reveal-image">
          <div class="logos__frame">
            <span class="logos__num">03</span>
            <img class="logos__img" src="img/logos/logo-3.png" alt="Logo 3" loading="lazy" onerror="this.style.display='none'" />
          </div>
        </figure>

        <figure class="logos__item reveal-image">
          <div class="logos__frame">
            <span class="logos__num">04</span>
            <img class="logos__img" src="img/logos/logo-4.png" alt="Logo 4" loading="lazy" onerror="this.style.display='none'" />
          </div>
        </figure>

        <figure class="logos__item reveal-image">
          <div class="logos__frame">
            <span class="logos__num">05</span>
            <img class="logos__img" src="img/logos/logo-5.png" alt="Logo 5" loading="lazy" onerror="this.style.display='none'" />
          </div>
        </figure>

        <figure class="logos__item reveal-image">
          <div class="logos__frame">
            <span class="logos__num">06</span>
            <img class="logos__img" src="img/logos/logo-6.png" alt="Logo 6" loading="lazy" onerror="this.style.display='none'" />
          </div>
        </figure>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span class="footer__brand">González Mendonça</span>
    <span class="footer__sub">Candela González Mendonça · Interiorismo &amp; Decoración</span>
    <a class="footer__social" href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
    <span class="footer__copy">&copy; <span id="year"></span> González Mendonça</span>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
